<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>零点行动 · 服务器监控</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0c10;color:#d8dae0;font-family:-apple-system,"PingFang SC",monospace;padding:12px;font-size:12px;line-height:1.5}
  h1{font-size:15px;color:#ff5a1f;margin-bottom:10px;letter-spacing:2px;font-weight:900}
  .sec{margin-bottom:14px}
  .sec-title{font-size:10px;color:#7a7f8c;letter-spacing:2px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #1e232c}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
  .card{background:rgba(28,32,38,.75);border:1px solid rgba(150,170,190,.2);border-radius:6px;padding:8px 10px}
  .label{font-size:9px;color:#7a7f8c;letter-spacing:1px;margin-bottom:4px}
  .val{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
  .unit{font-size:10px;color:#7a7f8c;margin-left:2px;font-weight:400}
  .up{color:#4ade80}.down{color:#7fe9ff}.warn{color:#ffcc33}.danger{color:#ff5a5a}.online{color:#ff5a1f}.ok{color:#4ade80}
  .chart{background:rgba(28,32,38,.75);border:1px solid rgba(150,170,190,.2);border-radius:6px;padding:8px;margin-bottom:8px}
  .chart-title{font-size:9px;color:#7a7f8c;letter-spacing:1.5px;margin-bottom:4px}
  canvas{display:block;width:100%;height:90px}
  .legend{display:flex;gap:12px;margin-top:4px;font-size:10px;color:#7a7f8c}
  .legend span::before{content:'';display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;vertical-align:middle}
  .legend .u::before{background:#4ade80}.legend .d::before{background:#7fe9ff}
  .legend .c::before{background:#ffcc33}.legend .m::before{background:#ff8c42}.legend .e::before{background:#ff5a5a}
  table{width:100%;border-collapse:collapse;font-size:11px}
  th{background:rgba(40,46,56,.7);color:#8ac8ff;padding:5px 6px;text-align:left;font-weight:600;font-size:10px;letter-spacing:1px;border-bottom:1px solid #2a3040}
  td{padding:4px 6px;border-bottom:1px solid #1a1e26;font-variant-numeric:tabular-nums}
  tr:nth-child(even){background:rgba(255,255,255,.02)}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle}
  .dot.on{background:#4ade80}.dot.off{background:#666}
  .log{max-height:180px;overflow-y:auto;background:rgba(28,32,38,.75);border:1px solid rgba(150,170,190,.2);border-radius:6px;padding:6px 8px;font-size:10px}
  .log-item{padding:2px 0;border-bottom:1px solid #161a22;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .log-item:last-child{border:none}
  .log-time{color:#5a6470;margin-right:6px}
  .log-c{color:#4ade80}.log-d{color:#7a7f8c}.log-e{color:#ff5a5a}
  .status{font-size:10px;color:#7a7f8c;text-align:right;margin-top:6px}
  .status.on{color:#4ade80}.status.off{color:#ff5a5a}
</style>
</head><body>

<h1>⚡ 零点行动 · 服务器监控</h1>

<div class="sec">
  <div class="sec-title">网络流量</div>
  <div class="grid">
    <div class="card"><div class="label">上行</div><div class="val up"><span id="upNow">--</span><span class="unit">KB/s</span></div><div class="label" style="margin-top:5px;margin-bottom:0">累计 <span id="upTotal" class="warn">--</span> MB</div></div>
    <div class="card"><div class="label">下行</div><div class="val down"><span id="downNow">--</span><span class="unit">KB/s</span></div><div class="label" style="margin-top:5px;margin-bottom:0">累计 <span id="downTotal" class="warn">--</span> MB</div></div>
    <div class="card"><div class="label">发送缓冲</div><div class="val" id="maxBuf">--<span class="unit">KB</span></div></div>
  </div>
</div>

<div class="sec">
  <div class="sec-title">服务器</div>
  <div class="grid">
    <div class="card"><div class="label">在线</div><div class="val online"><span id="online">--</span><span class="unit">人</span></div></div>
    <div class="card"><div class="label">运行时长</div><div class="val" id="uptime" style="font-size:13px">--</div></div>
    <div class="card"><div class="label">CPU</div><div class="val" id="cpuVal" style="font-size:15px">--<span class="unit">%</span></div><div class="label" style="margin-top:5px;margin-bottom:0">负载 <span id="loadVal">--</span> / <span id="coresVal">--</span> 核</div></div>
    <div class="card"><div class="label">系统内存</div><div class="val" id="memVal" style="font-size:15px">--<span class="unit">MB</span></div></div>
    <div class="card"><div class="label">进程 RSS</div><div class="val" id="rssVal" style="font-size:15px">--<span class="unit">MB</span></div></div>
    <div class="card"><div class="label">事件循环延迟</div><div class="val" id="elVal" style="font-size:15px">--<span class="unit">ms</span></div></div>
    <div class="card"><div class="label">总消息数</div><div class="val" id="msgVal" style="font-size:15px">--</div></div>
  </div>
</div>

<div class="sec">
  <div class="sec-title">曲线 · 最近 60 秒</div>
  <div class="chart"><div class="chart-title">网络</div><canvas id="cNet"></canvas><div class="legend"><span class="u">上行</span><span class="d">下行</span></div></div>
  <div class="chart"><div class="chart-title">CPU / 内存</div><canvas id="cSys"></canvas><div class="legend"><span class="c">CPU %</span><span class="m">内存 100MB</span></div></div>
  <div class="chart"><div class="chart-title">事件循环延迟</div><canvas id="cEl"></canvas><div class="legend"><span class="e">延迟 ms</span></div></div>
</div>

<div class="sec">
  <div class="sec-title">在线玩家</div>
  <table>
    <thead><tr><th>状态</th><th>ID</th><th>ClientId</th><th>IP</th><th>位置</th><th>HP</th><th>武器</th></tr></thead>
    <tbody id="plist"><tr><td colspan="7" style="text-align:center;color:#5a6470;padding:10px">暂无玩家</td></tr></tbody>
  </table>
</div>

<div class="sec">
  <div class="sec-title">最近事件</div>
  <div class="log" id="logList"><div class="log-item" style="color:#5a6470">暂无</div></div>
</div>

<div class="status off" id="status">连接中…</div>

<script>
const MAXPTS = 60;
const upH=[], downH=[], cpuH=[], memH=[], elH=[];
const cvN=document.getElementById('cNet'), ctxN=cvN.getContext('2d');
const cvS=document.getElementById('cSys'), ctxS=cvS.getContext('2d');
const cvE=document.getElementById('cEl'), ctxE=cvE.getContext('2d');
let dpr=1;
function fit(cv,ctx){dpr=Math.min(devicePixelRatio||1,2);const w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
function draw(ctx,cv,series){
  const w=cv.clientWidth,h=cv.clientHeight;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='rgba(150,170,190,.07)';ctx.lineWidth=1;
  for(let i=0;i<=3;i++){const y=(h-6)*i/3+3;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  let maxV=1;for(const s of series)for(const v of s.arr)if(v>maxV)maxV=v;
  maxV=Math.max(maxV,10)*1.15;
  const stepX=w/(MAXPTS-1);
  for(const s of series){
    if(s.arr.length<2)continue;
    ctx.strokeStyle=s.color;ctx.lineWidth=2;ctx.beginPath();
    const off=MAXPTS-s.arr.length;
    for(let i=0;i<s.arr.length;i++){const x=(off+i)*stepX,y=h-(s.arr[i]/maxV)*(h-6)-3;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
    ctx.stroke();
  }
  ctx.fillStyle='rgba(150,170,190,.45)';ctx.font='9px monospace';ctx.fillText(maxV.toFixed(0),3,10);
}
function fmtUp(s){if(s<60)return s+'秒';if(s<3600)return Math.floor(s/60)+'分'+Math.floor(s%60)+'秒';const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h+'时'+m+'分';}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function renderPlayers(players){
  const tb=document.getElementById('plist');
  const alive=players.filter(p=>p.conn);
  if(!alive.length){tb.innerHTML='<tr><td colspan="7" style="text-align:center;color:#5a6470;padding:10px">暂无玩家</td></tr>';return;}
  tb.innerHTML=alive.map(p=>{
    const cls=p.alive?'on':'off';
    const hpCls=p.hp<=30?'danger':p.hp<=60?'warn':'ok';
    return `<tr>
      <td><span class="dot ${cls}"></span>${p.alive?'活':'死'}</td>
      <td>${p.id}</td>
      <td>${esc(p.cid||'-')}</td>
      <td>${esc(p.ip||'-')}</td>
      <td>${p.x},${p.y},${p.z}</td>
      <td class="${hpCls}">${p.hp}</td>
      <td>${esc(p.weapon)}${p.crouch?' 蹲':''}${p.c4?' C4':''}</td>
    </tr>`;
  }).join('');
}

function renderLog(recent){
  const el=document.getElementById('logList');
  if(!recent||!recent.length){el.innerHTML='<div class="log-item" style="color:#5a6470">暂无</div>';return;}
  el.innerHTML=recent.map(r=>{
    const t=new Date(r.t).toLocaleTimeString('zh-CN');
    const cls=r.kind==='connect'?'log-c':r.kind==='disconnect'?'log-d':'log-e';
    return `<div class="log-item"><span class="log-time">${t}</span><span class="${cls}">[${r.kind}]</span> ${esc(r.msg)}</div>`;
  }).join('');
}

async function tick(){
  try{
    const r=await fetch('/api/metrics',{cache:'no-store'});
    const d=await r.json();
    if(!d.ok)throw new Error('bad resp');
    const net=d.net, srv=d.server, room=d.room;

    document.getElementById('upNow').textContent=net.upKBps.toFixed(1);
    document.getElementById('downNow').textContent=net.downKBps.toFixed(1);
    document.getElementById('upTotal').textContent=net.totalUpMB.toFixed(1);
    document.getElementById('downTotal').textContent=net.totalDownMB.toFixed(1);
    document.getElementById('maxBuf').innerHTML=(srv.maxBuf/1024).toFixed(1)+'<span class="unit">KB</span>';
    document.getElementById('online').textContent=room.online;
    document.getElementById('uptime').textContent=fmtUp(srv.uptimeSec);
    document.getElementById('cpuVal').innerHTML=srv.cpu.toFixed(1)+'<span class="unit">%</span>';
    document.getElementById('loadVal').textContent=srv.load.toFixed(2);
    document.getElementById('coresVal').textContent=srv.cores;
    document.getElementById('memVal').innerHTML=srv.memMB.toFixed(0)+'<span class="unit">MB</span>';
    document.getElementById('rssVal').innerHTML=srv.rssMB.toFixed(0)+'<span class="unit">MB</span>';
    const elCls=srv.elDelayMs>100?'danger':srv.elDelayMs>30?'warn':'ok';
    document.getElementById('elVal').innerHTML='<span class="'+elCls+'">'+srv.elDelayMs.toFixed(1)+'</span><span class="unit">ms</span>';
    document.getElementById('msgVal').textContent=srv.messages;

    upH.push(net.upKBps);downH.push(net.downKBps);
    cpuH.push(srv.cpu);memH.push(srv.memMB/100);
    elH.push(srv.elDelayMs);
    [upH,downH,cpuH,memH,elH].forEach(a=>{while(a.length>MAXPTS)a.shift();});

    draw(ctxN,cvN,[{arr:upH,color:'#4ade80'},{arr:downH,color:'#7fe9ff'}]);
    draw(ctxS,cvS,[{arr:cpuH,color:'#ffcc33'},{arr:memH,color:'#ff8c42'}]);
    draw(ctxE,cvE,[{arr:elH,color:'#ff5a5a'}]);

    renderPlayers(room.players);
    renderLog(d.recent);

    const st=document.getElementById('status');
    st.textContent='已连接 · '+new Date().toLocaleTimeString('zh-CN');
    st.className='status on';
  }catch(e){
    const st=document.getElementById('status');
    st.textContent='连接失败 · '+e.message;
    st.className='status off';
  }
}
fit(cvN,ctxN);fit(cvS,ctxS);fit(cvE,ctxE);
addEventListener('resize',()=>{fit(cvN,ctxN);fit(cvS,ctxS);fit(cvE,ctxE);});
tick();setInterval(tick,1000);
</script>
</body></html>
