<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VRM/VRMA 本地测试</title>
<style>
body{margin:0;background:#111;color:#0f0;font-family:monospace;overflow:hidden}
#log{position:fixed;top:0;left:0;right:0;max-height:45vh;overflow:auto;padding:8px;background:rgba(0,0,0,.85);font-size:12px;z-index:10;white-space:pre-wrap;word-break:break-all;line-height:1.4}
#log .ok{color:#0f0}
#log .err{color:#f44}
#log .warn{color:#fa0}
#log .info{color:#8cf}
canvas{display:block}
#btns{position:fixed;bottom:0;left:0;right:0;padding:8px;background:rgba(0,0,0,.85);z-index:10;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
button{padding:10px 14px;font-size:13px;background:#0a5;color:#fff;border:0;border-radius:4px;font-family:monospace}
button:active{background:#0f7}
</style>
</head>
<body>
<div id="log"></div>
<div id="btns"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.1.2/lib/three-vrm.module.js",
    "@pixiv/three-vrm-animation": "https://unpkg.com/@pixiv/three-vrm-animation@2.1.2/lib/three-vrm-animation.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from '@pixiv/three-vrm-animation';

const logEl = document.getElementById('log');
function log(msg, cls) {
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
  console.log(msg);
}
window.addEventListener('error', e => log('WINDOW ERR: ' + e.message, 'err'));
window.addEventListener('unhandledrejection', e => log('REJECT: ' + (e.reason?.message || e.reason), 'err'));

const VRM_URL = '/models/GO.vrm';
const DANCE_URLS = [
  '/animations/dance_fixed.glb',
  '/animations/d_a7f3c9e2.bin',
  '/animations/dance01.vrma',
  '/animations/VRMA_01.vrma',
  '/animations/CC0-walk.vrma',
  '/animations/Jump.vrma',
];

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x223344);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.3, 2.5);
camera.lookAt(0, 1.0, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.5));
const dlight = new THREE.DirectionalLight(0xffffff, 1.2);
dlight.position.set(2, 4, 3);
scene.add(dlight);
scene.add(new THREE.GridHelper(10, 10, 0x444444, 0x333333));

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});

let vrm = null;
let mixer = null;
const actions = {};

async function loadVRM() {
  try {
    log('加载 VRM: ' + VRM_URL, 'info');
    const loader = new GLTFLoader();
    loader.register(p => new VRMLoaderPlugin(p));
    const gltf = await loader.loadAsync(VRM_URL);
    vrm = gltf.userData.vrm;
    if (!vrm) throw new Error('vrm 数据为空');
    try { VRMUtils.removeUnnecessaryVertices(vrm.scene); } catch(e) { log('removeUnnecessaryVertices 警告: ' + (e.message||e), 'warn'); }
    vrm.scene.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
    scene.add(vrm.scene);
    mixer = new THREE.AnimationMixer(vrm.scene);
    log('✓ VRM 加载成功', 'ok');
    return true;
  } catch (e) {
    log('✗ VRM 加载失败: ' + (e.message || e), 'err');
    return false;
  }
}

async function loadOneDance(url, vrm) {
  const name = url.split('/').pop();
  try {
    log('加载动画: ' + url, 'info');
    const loader = new GLTFLoader();
    loader.register(p => new VRMAnimationLoaderPlugin(p));
    const gltf = await loader.loadAsync(url);
    const anims = gltf.userData.vrmAnimations;
    if (!anims || !anims.length) throw new Error('无 vrmAnimations 数据');
    const clip = createVRMAnimationClip(anims[0], vrm);
    const action = mixer.clipAction(clip);
    action.setLoop(THREE.LoopRepeat, Infinity);
    actions[name] = action;
    log('  ✓ ' + name + '  时长=' + clip.duration.toFixed(2) + 's  轨道=' + clip.tracks.length, 'ok');
  } catch (e) {
    log('  ✗ ' + name + '  失败: ' + (e.message || e), 'err');
  }
}

function buildButtons() {
  const btns = document.getElementById('btns');
  btns.innerHTML = '';
  for (const name of Object.keys(actions)) {
    const b = document.createElement('button');
    b.textContent = name;
    b.onclick = () => playOnly(name);
    btns.appendChild(b);
  }
  const stop = document.createElement('button');
  stop.textContent = '停止';
  stop.style.background = '#a33';
  stop.onclick = () => { mixer.stopAllAction(); log('停止', 'info'); };
  btns.appendChild(stop);
}

function playOnly(name) {
  if (!actions[name]) return;
  mixer.stopAllAction();
  actions[name].reset();
  actions[name].play();
  log('播放: ' + name, 'info');
}

async function main() {
  const ok = await loadVRM();
  if (!ok) return;
  for (const url of DANCE_URLS) {
    await loadOneDance(url, vrm);
  }
  log('=== 全部完成 ===', 'info');
  buildButtons();
}
main();

const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);
  if (vrm) vrm.update(dt);
  renderer.render(scene, camera);
}
loop();
</script>
</body>
</html>
