<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>WebGPU 测试 · Zero Point</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05080d; color: #cfe4ff;
    font-family: -apple-system, "PingFang SC", monospace; }
  #info { position: fixed; top: 8px; left: 8px; z-index: 10; font-size: 12px;
    background: rgba(0,0,0,0.75); padding: 8px 12px; border-radius: 6px;
    border: 1px solid #4a9eff; line-height: 1.6; white-space: pre-wrap; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.9); z-index: 100; text-align: center; padding: 20px;
    font-size: 14px; line-height: 1.8; }
  #err.show { display: flex; flex-direction: column; }
</style>
</head>
<body>

<div id="info">初始化…</div>
<div id="err"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.171.0/build/three.module.js",
    "three/webgpu": "https://unpkg.com/three@0.171.0/build/three.webgpu.js",
    "three/addons/": "https://unpkg.com/three@0.171.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three/webgpu';

const infoEl = document.getElementById('info');
const errEl  = document.getElementById('err');

function showError(msg) {
  errEl.textContent = '❌ ' + msg;
  errEl.classList.add('show');
}

function log(s) {
  infoEl.textContent = s;
  console.log(s);
}

// ===== 1. 检测 WebGPU =====
if (!navigator.gpu) {
  showError('浏览器不支持 WebGPU\n\n' +
    '· Android Chrome 需 121+ \n' +
    '· 或访问 chrome://flags 开启 #enable-unsafe-webgpu\n' +
    '· 当前 UA: ' + navigator.userAgent.slice(0, 80));
  throw new Error('no navigator.gpu');
}

const adapter = await navigator.gpu.requestAdapter();
if (!adapter) {
  showError('拿到 GPU adapter 失败');
  throw new Error('no adapter');
}

const adapterInfo = adapter.info || (adapter.requestAdapterInfo ? await adapter.requestAdapterInfo() : {});
log('✅ WebGPU 可用\n' +
    'vendor: ' + (adapterInfo.vendor || '?') + '\n' +
    'arch: '   + (adapterInfo.architecture || '?') + '\n' +
    'device: ' + (adapterInfo.device || '?'));

// ===== 2. 初始化渲染器 =====
let renderer;
try {
  renderer = new THREE.WebGPURenderer({ antialias: true });
  await renderer.init();
} catch (e) {
  showError('WebGPURenderer 初始化失败：' + e.message);
  throw e;
}

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ===== 3. 场景 =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1520);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 3, 8);

scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 1.5));
const dir = new THREE.DirectionalLight(0xffffff, 2);
dir.position.set(5, 10, 5);
scene.add(dir);

// 地面
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({ color: 0x2a3a4a, roughness: 0.9 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// 一堆彩色方块（测试 draw call）
const colors = [0xff4a4a, 0x4aff4a, 0x4a9eff, 0xffcc4a, 0xcc4aff, 0x4affcc];
const cubes = [];
for (let i = 0; i < 6; i++) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshStandardMaterial({ color: colors[i] })
  );
  m.position.set(Math.cos(i / 6 * Math.PI * 2) * 3, 0.5, Math.sin(i / 6 * Math.PI * 2) * 3);
  scene.add(m);
  cubes.push(m);
}

// ===== 4. 主循环 =====
let frames = 0, lastFpsT = performance.now(), fps = 0;
const clock = new THREE.Clock();

function loop() {
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();

  // 动画
  cubes.forEach((c, i) => {
    c.rotation.x = t * (0.5 + i * 0.1);
    c.rotation.y = t * (0.6 + i * 0.1);
  });

  // FPS
  frames++;
  const now = performance.now();
  if (now - lastFpsT >= 1000) {
    fps = frames;
    frames = 0;
    lastFpsT = now;
    log('🎮 WebGPU 测试\n' +
        'FPS: ' + fps + '\n' +
        '分辨率: ' + window.innerWidth + '×' + window.innerHeight + '\n' +
        'DPR: ' + window.devicePixelRatio + '\n' +
        '方块数: ' + cubes.length);
  }

  renderer.render(scene, camera);
}
loop();

// 尺寸变化
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
