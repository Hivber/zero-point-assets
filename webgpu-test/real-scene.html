<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>真实场景对比测试</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05080d; color:#cfe4ff;
    font-family:-apple-system,"PingFang SC",monospace; }
  #hud { position:fixed; top:8px; left:8px; z-index:10; font-size:11px;
    background:rgba(0,0,0,0.8); padding:8px 12px; border-radius:6px;
    border:1px solid #4a9eff; line-height:1.6; white-space:pre; }
  #ctrl { position:fixed; bottom:8px; left:8px; right:8px; z-index:10;
    display:flex; gap:6px; flex-wrap:wrap; }
  #ctrl button { flex:1; min-width:70px; padding:8px 6px; font-size:11px;
    background:rgba(20,40,80,0.9); border:1px solid #4a9eff; color:#cfe4ff;
    border-radius:6px; font-family:inherit; cursor:pointer; }
  #ctrl button:active { background:rgba(60,100,180,0.9); }
  #err { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.9); z-index:100; text-align:center; padding:20px;
    font-size:13px; line-height:1.8; }
  #err.show { display:flex; flex-direction:column; }
</style>
</head>
<body>
<div id="hud">初始化…</div>
<div id="err"></div>
<div id="ctrl">
  <button id="btn100">100 方块</button>
  <button id="btn500">500 方块</button>
  <button id="btn1000">1000 方块</button>
  <button id="btnShadow">阴影: 关</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.171.0/build/three.module.js",
    "three/webgpu": "https://unpkg.com/three@0.171.0/build/three.webgpu.js",
    "three/addons/": "https://unpkg.com/three@0.171.0/examples/jsm/"
  }
}
</script>

<script type="module">
const params = new URLSearchParams(location.search);
const mode = params.get('mode') || 'gpu';

const hudEl = document.getElementById('hud');
const errEl = document.getElementById('err');
const log = (s) => { hudEl.textContent = s; };

if (mode === 'gpu' && !navigator.gpu) {
  errEl.textContent = '当前浏览器不支持 WebGPU，请用 ?mode=gl 测试 WebGL';
  errEl.classList.add('show');
  throw new Error('no webgpu');
}

let THREE, renderer;
if (mode === 'gpu') {
  THREE = await import('three/webgpu');
  renderer = new THREE.WebGPURenderer({ antialias: true });
  await renderer.init();
} else {
  THREE = await import('three');
  renderer = new THREE.WebGLRenderer({ antialias: true });
}

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
if (renderer.shadowMap) renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1520);
scene.fog = new THREE.Fog(0x0a1520, 40, 120);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 15, 25);
camera.lookAt(0, 0, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 1.2));
const dir = new THREE.DirectionalLight(0xffffff, 1.5);
dir.position.set(20, 30, 20);
dir.castShadow = false;
scene.add(dir);

// ===== 地形（噪声生成，模拟你的地形地图）=====
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeNoise(seed) {
  const rand = mulberry32(seed);
  const size = 256;
  const grid = new Float32Array(size * size);
  for (let i = 0; i < grid.length; i++) grid[i] = rand() * 2 - 1;
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const lerp = (a, b, t) => a + (b - a) * t;
  const idx = (x, y) => ((x & 255) * size + (y & 255));
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    const u = fade(x - xi), v = fade(y - yi);
    return lerp(
      lerp(grid[idx(xi, yi)], grid[idx(xi + 1, yi)], u),
      lerp(grid[idx(xi, yi + 1)], grid[idx(xi + 1, yi + 1)], u),
      v
    );
  };
}
function fbm(noise, x, y, oct, scale) {
  let v = 0, amp = 1, freq = scale, max = 0;
  for (let i = 0; i < oct; i++) {
    v += noise(x * freq, y * freq) * amp;
    max += amp; amp *= 0.5; freq *= 2;
  }
  return v / max;
}

const SEG = 96, SIZE = 200;
const noise = makeNoise(20260924);
const terrainGeo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
terrainGeo.rotateX(-Math.PI / 2);
const tPos = terrainGeo.attributes.position;
for (let i = 0; i < tPos.count; i++) {
  const x = tPos.getX(i), z = tPos.getZ(i);
  tPos.setY(i, fbm(noise, x, z, 4, 0.02) * 25);
}
terrainGeo.computeVertexNormals();
const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({
  color: 0x6a8a4a, roughness: 0.9, metalness: 0.05, flatShading: false
}));
scene.add(terrain);

// ===== 一堆箱子（模拟地图里的掩体）=====
const crateGeo = new THREE.BoxGeometry(1, 1, 1);
const crateMat = new THREE.MeshStandardMaterial({ color: 0xb88a50, roughness: 0.85 });
const crates = [];

function clearCrates() {
  for (const c of crates) scene.remove(c);
  crates.length = 0;
}

function spawnCrates(n) {
  clearCrates();
  const rand = mulberry32(42);
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(crateGeo, crateMat);
    m.position.set(
      (rand() - 0.5) * SIZE * 0.8,
      0.5 + rand() * 15,
      (rand() - 0.5) * SIZE * 0.8
    );
    m.rotation.y = rand() * Math.PI * 2;
    m.castShadow = renderer.shadowMap && renderer.shadowMap.enabled;
    scene.add(m);
    crates.push(m);
  }
}
spawnCrates(100);

// ===== FPS 统计 =====
let frames = 0, lastT = performance.now(), fps = 0;
let prevFrames = 0, renderCalls = 0, triangles = 0;

function updateHUD() {
  const info = renderer.info;
  renderCalls = info ? (info.render?.calls || 0) : 0;
  triangles  = info ? (info.render?.triangles || 0) : 0;
  log(
    '🎮 模式: ' + (mode === 'gpu' ? 'WebGPU' : 'WebGL') + '\n' +
    'FPS: ' + fps + '\n' +
    '方块数: ' + crates.length + '\n' +
    '分辨率: ' + window.innerWidth + '×' + window.innerHeight + '\n' +
    'DPR: ' + window.devicePixelRatio + '\n' +
    'Draw Calls: ' + renderCalls + '\n' +
    'Triangles: ' + triangles.toLocaleString() + '\n' +
    '阴影: ' + (renderer.shadowMap && renderer.shadowMap.enabled ? '开' : '关')
  );
}

const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = clock.getDelta();

  for (let i = 0; i < crates.length; i++) {
    crates[i].rotation.y += dt * 0.5;
  }

  renderer.render(scene, camera);

  frames++;
  const now = performance.now();
  if (now - lastT >= 1000) {
    fps = frames;
    frames = 0;
    lastT = now;
    updateHUD();
  }
}
loop();

// ===== 控制按钮 =====
document.getElementById('btn100').onclick = () => spawnCrates(100);
document.getElementById('btn500').onclick = () => spawnCrates(500);
document.getElementById('btn1000').onclick = () => spawnCrates(1000);
const shadowBtn = document.getElementById('btnShadow');
shadowBtn.onclick = () => {
  if (!renderer.shadowMap) return;
  renderer.shadowMap.enabled = !renderer.shadowMap.enabled;
  shadowBtn.textContent = '阴影: ' + (renderer.shadowMap.enabled ? '开' : '关');
  for (const c of crates) c.castShadow = renderer.shadowMap.enabled;
  // 触发材质重编译
  scene.traverse(o => { if (o.material) {
    const ms = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of ms) m.needsUpdate = true;
  }});
};

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
